# P3.2-A — Alembic scaffold (not authoritative yet; see docs/P3_2_ALEMBIC_INTRODUCTION_PLAN.md).
# Runtime schema evolution still uses app.migrate_schema() on SQLite.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Overridden in alembic/env.py from paths.DATABASE_URL for local consistency.
sqlalchemy.url = sqlite:///erp_data.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
